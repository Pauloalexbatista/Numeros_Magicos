services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: numeros-magicos:latest
    container_name: numeros-magicos-app
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/dev.db
      - NEXTAUTH_URL=http://localhost:3000
      - AUTH_TRUST_HOST=true
      - AUTH_SECRET=${AUTH_SECRET:-please-change-this-secret-in-production-use-openssl-rand-base64-32}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-please-change-this-secret-in-production-use-openssl-rand-base64-32}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-}
      - CRON_SECRET=${CRON_SECRET:-}
    volumes:
      # Mount the entire prisma directory to allow SQLite to create lock files
      - ./prisma:/app/prisma
      # Mount the /brain directory if your app writes artifacts there
      #- ./.gemini/antigravity/brain:/app/brain

volumes:
  db_data:
