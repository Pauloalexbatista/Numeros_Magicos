services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: numeros-magicos:prod
    container_name: numeros-magicos-prod
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/dev.db
      - NEXTAUTH_URL=https://numerosmagicos.com  # AJUSTAR PARA O TEU DOMÍNIO
      - AUTH_TRUST_HOST=true
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - CRON_SECRET=${CRON_SECRET}
    volumes:
      - ./prisma:/app/prisma
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.numeros-magicos.rule=Host(`numerosmagicos.com`)" # AJUSTAR PARA O TEU DOMÍNIO
      - "traefik.http.routers.numeros-magicos.entrypoints=websecure"
      - "traefik.http.routers.numeros-magicos.tls.certresolver=myresolver" # O resolver do Hostinger costuma ser este
      - "traefik.http.services.numeros-magicos.loadbalancer.server.port=3000"

  # Container para automatizar os cálculos (Cron Helper)
  cron:
    image: numeros-magicos:prod
    container_name: numeros-magicos-cron
    restart: always
    volumes:
      - ./prisma:/app/prisma
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
    # Comando para correr um loop que verifica todos os sorteios a cada hora
    entrypoint: ["sh", "-c", "while true; do npm run db:update:all; sleep 3600; done"]
