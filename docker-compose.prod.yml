services:
  db:
    image: postgres:16-alpine
    container_name: numeros-magicos-db
    restart: always
    environment:
      - POSTGRES_USER=magico_user
      - POSTGRES_PASSWORD=Magico_Password_2026!
      - POSTGRES_DB=numeros_magicos
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magico_user -d numeros_magicos"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: numeros-magicos:prod
    container_name: numeros-magicos-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://magico_user:Magico_Password_2026!@db:5432/numeros_magicos?sslmode=disable
      - NEXTAUTH_URL=https://numerosmagicos.com
      - AUTH_TRUST_HOST=true
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - CRON_SECRET=${CRON_SECRET}
    # REMOVED: ./prisma:/app/prisma (Prevents SQLite schema from overwriting build-time Postgres schema)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.numeros-magicos.rule=Host(`numerosmagicos.com`)"
      - "traefik.http.routers.numeros-magicos.entrypoints=websecure"
      - "traefik.http.routers.numeros-magicos.tls.certresolver=myresolver"
      - "traefik.http.services.numeros-magicos.loadbalancer.server.port=3000"

  cron:
    image: numeros-magicos:prod
    container_name: numeros-magicos-cron
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://admin_magico:UmaSenhaForte123@172.16.16.2:5432/numeros_magicos_prod?sslmode=disable
      - CRON_SECRET=${CRON_SECRET}
    entrypoint: ["/app/database-engine/entrypoint.sh"]
    command: ["npx", "tsx", "src/scripts/core/cron-manager.ts"]
