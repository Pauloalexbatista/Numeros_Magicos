<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="totoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="200" height="80" rx="8" fill="url(#totoGrad)"/>
  
  <!-- Clover decoration (trevo) -->
  <g fill="#dcfce7" opacity="0.9">
    <!-- Four leaf clover -->
    <circle cx="25" cy="25" r="6"/>
    <circle cx="35" cy="25" r="6"/>
    <circle cx="25" cy="35" r="6"/>
    <circle cx="35" cy="35" r="6"/>
    <!-- Stem -->
    <rect x="28" y="35" width="4" height="12" rx="2"/>
    
    <!-- Small clover on right -->
    <circle cx="170" cy="55" r="4"/>
    <circle cx="178" cy="55" r="4"/>
    <circle cx="170" cy="63" r="4"/>
    <circle cx="178" cy="63" r="4"/>
    <rect x="172" y="63" width="3" height="8" rx="1.5"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">
    TOTOLOTO
  </text>
  <text x="100" y="58" font-family="Arial, sans-serif" font-size="9" fill="#dcfce7" text-anchor="middle">
    PORTUGAL
  </text>
</svg>
