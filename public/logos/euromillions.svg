<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="euroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fcd34d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="200" height="80" rx="8" fill="url(#euroGrad)"/>
  
  <!-- Stars decoration -->
  <g fill="url(#goldGrad)">
    <!-- Top star -->
    <path d="M 30 20 L 32 26 L 38 26 L 33 30 L 35 36 L 30 32 L 25 36 L 27 30 L 22 26 L 28 26 Z"/>
    <!-- Bottom star -->
    <path d="M 170 54 L 172 60 L 178 60 L 173 64 L 175 70 L 170 66 L 165 70 L 167 64 L 162 60 L 168 60 Z"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">
    EUROMILHÕES
  </text>
  <text x="100" y="55" font-family="Arial, sans-serif" font-size="10" fill="#fcd34d" text-anchor="middle">
    EUROMILLIONS
  </text>
</svg>
